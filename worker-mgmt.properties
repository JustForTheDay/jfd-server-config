# Server Port (optional, default is 8080)
server.port=8081
#spring.application.name=worker-mgmt


#Local MongoDB config
#spring.data.mongodb.database=worker_mgmt
#spring.data.mongodb.port=27017
#spring.data.mongodb.host=127.0.0.1


# src/main/resources/application.properties
# MongoDB Configuration
# Replace 'localhost:27017' with your MongoDB host and port if different.
# 'worker_mgmt' is the database name as specified in the prompt.
spring.data.mongodb.uri=mongodb://localhost:27017/worker_mgmt

# Kafka Producer Configuration
# Replace 'localhost:9092' with your Kafka broker address if different.
spring.kafka.producer.bootstrap-servers=kafka:9092

# Custom application properties
# This defines the Kafka topic name for worker registration events.
app.kafka.topic.worker.registration=worker-registration-events

# Actuator Endpoints Configuration
# Expose all actuator endpoints for monitoring and management
management.endpoints.web.exposure.include=*

# Swagger UI (OpenAPI) Configuration
#springdoc.swagger-ui.path=/swagger-ui.html
#springdoc.api-docs.path=/v3/api-docs

# Logging Configuration (optional)
logging.level.com.example.worker_registration=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.kafka=DEBUG

